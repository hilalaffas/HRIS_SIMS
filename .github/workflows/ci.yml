name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      # Lint belum diwajibkan lulus: ada temuan lama (aturan react-hooks). Hapus
      # continue-on-error setelah temuan lama dirapikan.
      - run: npm run lint
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # -DskipTests ada di Dockerfile; tes dijalankan di sini.
      # Bila SimsApplicationTests butuh database, tambahkan service postgres atau exclude test itu.
      - run: ./mvnw -B -ntp verify
