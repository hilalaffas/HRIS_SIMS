spring.application.name=SIMS

# [BARU] Render menyuntikkan env var PORT untuk web service. Kalau tidak ada
# (mis. saat run lokal), tetap pakai 8080 seperti sebelumnya.
server.port=${PORT:8080}

# Formatnya: ${NAMA_VARIABEL:nilai_default_untuk_lokal}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/db_sims}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# [UBAH] Reverse geocoding (nama lokasi absensi). Provider otomatis: Google (bila key
# diisi) -> LocationIQ (bila key diisi) -> Nominatim/OpenStreetMap (tanpa key).
# Semua key SERVER-side. Matikan fitur: GEOCODING_ENABLED=false.
geocoding.enabled=${GEOCODING_ENABLED:true}
geocoding.provider=${GEOCODING_PROVIDER:auto}
google.maps.geocoding-api-key=${GOOGLE_MAPS_GEOCODING_API_KEY:}
locationiq.api-key=${LOCATIONIQ_API_KEY:}
# Nominatim: User-Agent WAJIB mengidentifikasi aplikasi (+ kontak admin).
geocoding.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
geocoding.nominatim.user-agent=${NOMINATIM_USER_AGENT:SIMS-HRIS/1.0 (admin@domain-anda.com)}
# [BARU] RestTemplate mencatat URL request di level DEBUG (termasuk "&key=..."), dan
# logging.level.org.springframework.web=DEBUG di bawah mencakupnya -- diturunkan
# ke INFO supaya API key tidak bocor ke log Render.
logging.level.org.springframework.web.client.RestTemplate=INFO

# flyway ganti dari update ke validate
spring.jpa.hibernate.ddl-auto=validate

# [UBAH] Default dimatikan (produksi). Nyalakan lokal: JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# [UBAH] Baris "logging.level.com.example=DEBUG" dihapus -- itu sisa
# boilerplate template Spring, package aplikasi ini adalah sys.hris.sims
# jadi baris tersebut tidak pernah berefek apapun.
logging.level.root=INFO
# [UBAH] DEBUG di produksi mencatat detail request & SQL (berpotensi memuat data pribadi
# karyawan) ke log Render. Default INFO; nyalakan lokal lewat LOG_LEVEL_WEB / LOG_LEVEL_SQL=DEBUG.
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
springdoc.api-docs.resolve-schema-properties=false
# [BARU] Swagger UI & /v3/api-docs terbuka untuk publik (lihat SecurityConfig). Default tetap
# aktif agar perilaku tidak berubah; di produksi (Render) set SWAGGER_ENABLED=false.
# [UBAH] Default sekarang MATI (aman untuk production). Nyalakan lokal: SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# biar akses backend jadi https
server.forward-headers-strategy=framework
# [UBAH] Naik dari 1MB -> 4MB. Batas global ini sebelumnya cuma dipakai
# untuk upload foto profil (yang punya validasi bisnis SENDIRI 1MB, lihat
# CloudinaryService.uploadFoto()) -- jadi menaikkannya TIDAK melonggarkan
# batas foto profil. Alasan naik: fitur baru upload gambar konten berita
# (CloudinaryService.uploadNewsImage(), dipakai AnnouncementModal) mengizinkan
# sampai 3MB per gambar; dengan limit global lama (1MB) Spring akan menolak
# request itu duluan sebelum sempat sampai ke controller/validasi kita.
# Membatasi maksimal ukuran satu file yang diupload menjadi 4MB
spring.servlet.multipart.max-file-size=4MB
# Membatasi maksimal ukuran total request (termasuk data form text lainnya) menjadi 4MB
spring.servlet.multipart.max-request-size=4MB

# [BARU] Username akun dev (panel /devAccess & alat /api/dev/**). SENGAJA tidak ditulis di
# repo: isi lewat environment variable DEV_ACCESS_USERNAME (Render -> Environment).
# Kosong = tidak ada akun dev, panel & endpoint dev tertutup untuk semua orang.
dev.access.username=${DEV_ACCESS_USERNAME:}

# [BARU] Penyimpanan file upload (foto profil, foto absensi, surat dokter, gambar berita).
#   cloudinary (default) = Cloudinary, dipakai di Render/production
#   local                = simpan di folder disk (khusus development, lihat application-local.properties)
storage.mode=${STORAGE_MODE:cloudinary}
storage.local.dir=${STORAGE_LOCAL_DIR:uploads}
storage.local.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

# [BARU] Awalan folder Cloudinary per environment. Kosong = production. Dev: dev
cloudinary.folder-prefix=${CLOUDINARY_FOLDER_PREFIX:}

# Validasi geofence untuk absensi di kantor. Isi koordinat titik kantor resmi
# Titik kantor resmi dan radius validasi absensi kantor. Environment variable
# dapat menimpa nilai default ini pada deployment.
attendance.office.latitude=${OFFICE_LATITUDE:-6.27588960352447}
attendance.office.longitude=${OFFICE_LONGITUDE:106.82955934313325}
attendance.office.radius-meters=${OFFICE_RADIUS_METERS:50}

# [BARU] Performa: kompres respons JSON (daftar karyawan, saldo cuti, dll) -- biasanya
# mengecilkan ukuran transfer 70-90%, sangat terasa di jaringan lambat.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# [BARU] Performa: relasi @ManyToOne EAGER yang tersisa (user, role, divisi, jenis cuti, dll) dimuat
# per kelompok 50 id sekaligus, bukan satu query per baris. Jaring pengaman N+1 untuk semua endpoint.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# [BARU] Performa koneksi database (Railway -> Neon). Semua nilai bisa di-override lewat environment variable.
# Sengaja TANPA keepalive-time: keepalive akan menahan Neon agar tidak auto-suspend (biaya compute naik).
# max-lifetime < batas koneksi idle di sisi Neon/pooler, supaya tidak memakai koneksi yang sudah ditutup
# sepihak (penyebab request pertama yang lambat/gagal setelah idle).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:270000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:120000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}


# ============================================================
# [BARU] Hardening & performa (security-hardening patch)
# ============================================================
# Origin CORS yang diizinkan (koma). Kosong = default dev. Production: isi domain frontend resmi saja.
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}

# Rate limit endpoint publik (login & lupa sandi). Lihat security/RateLimitFilter.java
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
# [UBAH] max-per-minute = batas lonjakan (semua request login per IP per menit).
ratelimit.login.max-per-minute=${RATE_LIMIT_LOGIN_PER_MIN:30}
# [BARU] batas login GAGAL per IP dalam 10 menit (login berhasil mereset hitungan).
ratelimit.login.max-failures-per-10-minutes=${RATE_LIMIT_LOGIN_FAILURES_PER_10MIN:15}
# [BARU] header IP klien dari proxy (Render berada di belakang Cloudflare). Kosongkan untuk memakai X-Forwarded-For/remote address.
ratelimit.client-ip-header=${RATE_LIMIT_CLIENT_IP_HEADER:CF-Connecting-IP}
ratelimit.forgot-password.max-per-10-minutes=${RATE_LIMIT_FORGOT_PER_10MIN:5}
ratelimit.forgot-password.global-max-per-10-minutes=${RATE_LIMIT_FORGOT_GLOBAL_PER_10MIN:40}

# true = server menolak start bila masih ada akun dengan password bawaan repo (disarankan di production)
security.fail-on-default-credentials=${FAIL_ON_DEFAULT_CREDENTIALS:false}

# Jangan bocorkan detail error / stacktrace / nama class ke klien
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Matikan server header & shutdown rapi (deploy Railway tanpa memutus request yang sedang jalan)
server.server-header=
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Performa: keep-alive koneksi
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-keep-alive-requests=200

# [BARU] Monitoring request untuk akun dev (tab Monitoring di /devAccess).
# Request >= ambang ini (ms) dianggap lambat; kejadian penting disimpan selama retention-days hari.
monitoring.slow-threshold-ms=${MONITORING_SLOW_THRESHOLD_MS:1000}
monitoring.retention-days=${MONITORING_RETENTION_DAYS:14}
