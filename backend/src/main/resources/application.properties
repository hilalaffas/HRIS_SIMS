spring.application.name=SIMS

# [BARU] Render menyuntikkan env var PORT untuk web service. Kalau tidak ada
# (mis. saat run lokal), tetap pakai 8080 seperti sebelumnya.
server.port=${PORT:8080}

# Formatnya: ${NAMA_VARIABEL:nilai_default_untuk_lokal}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/db_sims}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# flyway ganti dari update ke validate
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# [UBAH] Baris "logging.level.com.example=DEBUG" dihapus -- itu sisa
# boilerplate template Spring, package aplikasi ini adalah sys.hris.sims
# jadi baris tersebut tidak pernah berefek apapun.
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
springdoc.api-docs.resolve-schema-properties=false

# biar akses backend jadi https
server.forward-headers-strategy=framework
# [UBAH] Naik dari 1MB -> 4MB. Batas global ini sebelumnya cuma dipakai
# untuk upload foto profil (yang punya validasi bisnis SENDIRI 1MB, lihat
# CloudinaryService.uploadFoto()) -- jadi menaikkannya TIDAK melonggarkan
# batas foto profil. Alasan naik: fitur baru upload gambar konten berita
# (CloudinaryService.uploadNewsImage(), dipakai AnnouncementModal) mengizinkan
# sampai 3MB per gambar; dengan limit global lama (1MB) Spring akan menolak
# request itu duluan sebelum sempat sampai ke controller/validasi kita.
# Membatasi maksimal ukuran satu file yang diupload menjadi 4MB
spring.servlet.multipart.max-file-size=4MB
# Membatasi maksimal ukuran total request (termasuk data form text lainnya) menjadi 4MB
spring.servlet.multipart.max-request-size=4MB